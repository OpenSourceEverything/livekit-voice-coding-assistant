# Runs the scenarios in scenarios.yaml against your agent on LiveKit Cloud.
# Simulations spend real inference, so this requires an explicit manual run.
# Set RUN_LIVEKIT_SIMULATIONS=true only after reviewing the account budget. Run
# `lk agent simulate text --scenarios scenarios.yaml` locally while iterating.
name: Simulations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    if: vars.RUN_LIVEKIT_SIMULATIONS == 'true'
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "0.13.5"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Download model files
      run: uv run python src/agent.py download-files

    - name: Install pinned local tools
      run: bash tools/bootstrap.sh

    - name: Run simulations
      run: .tools/bin/lk agent simulate text --scenarios scenarios.yaml
