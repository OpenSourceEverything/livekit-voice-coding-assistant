[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-voice-coding-assistant"
version = "0.1.0"
description = "LiveKit voice coding assistant with scoped repository tools and local patch review"
requires-python = ">=3.12, <3.13"

dependencies = [
    "livekit-agents[silero]==1.8.8",
    "livekit-plugins-ai-coustics==0.3.5",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools]
py-modules = ["agent", "repository", "changes", "codex_bridge", "settings", "telemetry", "phone_auth", "usage", "jobs", "call_diagnostics", "interruption"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Local helper modules are tested from the checkout, not installed as runtime code.
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
